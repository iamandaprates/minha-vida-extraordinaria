<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Mive: centro de comando de execução. Planejamento, execução e evolução em um só lugar." />
    <meta name="theme-color" content="#fbfbff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mive" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2" />
    <title>Mive</title>
    <script>
      // Applies the saved theme before the first paint, so the page never flashes the wrong one.
      (function () {
        var theme; try { theme = localStorage.getItem('mive-theme'); } catch (error) { /* preference only */ }
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (theme === 'dark') { document.documentElement.classList.add('dark-mode'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d0c14'); }
      })();
    </script>
    <style>html { background: #fbfbff; } html.dark-mode { background: #0d0c14; }</style>
  </head>
  <body><div id="root"></div><noscript>A Mive precisa de JavaScript para abrir.</noscript><script type="module" src="/src/main.tsx"></script></body>
</html>
